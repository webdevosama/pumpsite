<!-- components/section-hero.html -->
<section class="relative bg-main overflow-hidden pt-32 pb-20 md:pt-40 md:pb-32">
  <!-- Subtle grid pattern on left side only (optional) -->
  <div class="absolute inset-0 opacity-10 pointer-events-none lg:left-0 lg:w-1/2" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>
  
  <div class="container mx-auto px-6 relative z-10">
    <div class="flex flex-col lg:flex-row items-center gap-12 lg:gap-16">
      
      <!-- Left Side: Text Content (navy background) -->
      <div class="lg:w-1/2 text-center lg:text-left space-y-6">
        <div class="inline-block px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-sm text-white/80 text-xs font-bold tracking-[0.3em] uppercase border border-white/20">
          🇸🇩 Since 1966
        </div>
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white leading-tight">
          Premium <span class="text-secondary">Pumps & Motors</span>
        </h1>
        <p class="text-white/70 text-lg max-w-xl mx-auto lg:mx-0 leading-relaxed">
          Import, supply & installation for agriculture, industry & municipalities.
        </p>
        <div class="flex flex-wrap gap-4 justify-center lg:justify-start pt-4">
          <a href="/products.html" class="px-8 py-3 bg-white text-main font-bold rounded-full hover:bg-main transition shadow-lg">View Catalog</a>
          <a href="/contact.html" class="px-8 py-3 border border-white/30 text-white font-bold rounded-full bg-white/10 hover:bg-white/20 transition backdrop-blur-sm">Get a Quote</a>
        </div>
      </div>

      <!-- Right Side: Image Carousel (white background, elevated) -->
      <div class="lg:w-1/2 relative">
        <div class="bg-white rounded-2xl shadow-2xl p-4">
          <div id="hero-carousel" class="relative rounded-xl overflow-hidden aspect-[4/3] bg-gray-50">
            <div id="hero-bg-slides" class="relative w-full h-full">
              <!-- Carousel slides injected by JS -->
            </div>
            <!-- Navigation Arrows (optional) -->
            <button id="carousel-prev" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 rounded-full flex items-center justify-center shadow-md hover:bg-white transition z-10">
              <i class="fa-solid fa-chevron-left text-main"></i>
            </button>
            <button id="carousel-next" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 rounded-full flex items-center justify-center shadow-md hover:bg-white transition z-10">
              <i class="fa-solid fa-chevron-right text-main"></i>
            </button>
            <!-- Dots indicator -->
            <div id="carousel-dots" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2 z-10"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
